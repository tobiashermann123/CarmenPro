name: Nightly Valuation

on:
  schedule:
    # 22:00 UTC = 18:00 EDT (summer) / 17:00 EST (winter), Mon–Fri (2h after US market close)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  valuation:
    name: DCF + Piotroski + sync dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CARMENBOT_SPREADSHEET_ID:  ${{ secrets.CARMENBOT_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout CarmenPro
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run DCF + Piotroski valuation
        run: python scripts/run_valuation.py

      - name: Sync updated scores to Google Sheets
        run: python scripts/sync_to_gsheet.py

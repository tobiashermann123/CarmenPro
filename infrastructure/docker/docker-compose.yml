services:
  metabase:
    image: metabase/metabase:latest
    container_name: carmenpro-metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase.db
    environment:
      MB_DB_FILE: /metabase.db/metabase.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  metabase-data:
